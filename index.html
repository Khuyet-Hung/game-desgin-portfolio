<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Hung09 — Game Designer Portfolio</title>
  <style>
    :root {
      --bg: #0b0d12;
      --surface: #121620;
      --surface-2: #181d29;
      --text: #f4f6fb;
      --muted: #aab2c2;
      --line: #2a3140;
      --accent: #7c9cff;
      --accent-2: #9c7cff;
      --max: 1120px;
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .container { width: min(var(--max), calc(100% - 40px)); margin: auto; }
    nav {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      background: rgba(11, 13, 18, .82);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .nav-inner {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .brand { font-weight: 800; letter-spacing: .02em; }
    .nav-links { display: flex; gap: 22px; color: var(--muted); font-size: .94rem; }
    .nav-links a:hover { color: var(--text); }
    .lang-toggle {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
      background: var(--surface);
    }
    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 5px 9px;
      border-radius: 999px;
      font-weight: 800;
      font-size: .78rem;
      cursor: pointer;
    }
    .lang-btn.active {
      background: var(--text);
      color: var(--bg);
    }

    section { padding: 88px 0; }
    .hero {
      min-height: 88vh;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      width: 620px;
      height: 620px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,156,255,.18), transparent 68%);
      top: -220px;
      right: -120px;
      pointer-events: none;
    }
    .eyebrow {
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: .78rem;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(3rem, 8vw, 6.7rem);
      line-height: .98;
      margin: 0;
      max-width: 850px;
      letter-spacing: -.055em;
    }
    .hero h1 span { color: var(--accent); }
    .lead {
      max-width: 760px;
      color: var(--muted);
      font-size: 1.18rem;
      margin: 28px 0;
    }
    .buttons { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-weight: 700;
    }
    .btn.primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .section-head { margin-bottom: 34px; }
    .section-head h2 {
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1.05;
      margin: 0 0 12px;
      letter-spacing: -.035em;
    }
    .section-head p { margin: 0; color: var(--muted); max-width: 720px; }

    .about-grid, .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px;
    }
    .card h3 { margin-top: 0; }
    .muted { color: var(--muted); }

    .principles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 24px;
    }
    .principle {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
    }
    .principle strong { display: block; margin-bottom: 8px; }

    .project-card {
      min-height: 270px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tag {
      display: inline-block;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }
    .project-card h3 {
      font-size: 1.7rem;
      margin: 0 0 10px;
    }
    .meta {
      color: var(--muted);
      font-size: .9rem;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .case-study { border-top: 1px solid var(--line); }
    .case-header {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 50px;
      align-items: end;
      margin-bottom: 42px;
    }
    .case-header h2 {
      font-size: clamp(2.5rem, 5vw, 4.4rem);
      line-height: .98;
      letter-spacing: -.045em;
      margin: 0;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
    .stat small { display: block; color: var(--muted); }
    .stat strong { font-size: 1.1rem; }

    .case-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .case-grid .wide { grid-column: 1 / -1; }
    .flow {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 18px;
    }
    .flow span {
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: .9rem;
      font-weight: 700;
    }
    .arrow { color: var(--accent); font-weight: 900; }

    .formula {
      margin-top: 18px;
      padding: 18px;
      border-radius: 12px;
      background: #0e121a;
      border: 1px dashed var(--line);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-x: auto;
    }

    ul { padding-left: 20px; }
    footer {
      border-top: 1px solid var(--line);
      padding: 42px 0;
      color: var(--muted);
    }

    @media (max-width: 800px) {
      .nav-links { display: none; }
      section { padding: 64px 0; }
      .about-grid, .project-grid, .case-grid, .case-header { grid-template-columns: 1fr; }
      .case-grid .wide { grid-column: auto; }
      .principles { grid-template-columns: 1fr; }
      .hero { min-height: 78vh; }
    }
  </style>
</head>

    "about.lead":"My professional background is in software engineering, where I have spent 3+ years building web and mobile products. Alongside that work, I discovered that I particularly enjoy designing interactive experiences: deciding what players should do, what choices they should make, and how rules can keep a group engaged.",
    "about.why":"Why Game Design?", "about.whyText":"I started exploring Game Design through English club and volunteer activities, where I designed and ran multiplayer games for small groups. These experiences made me interested in gameplay loops, scoring, player decisions, competition, and the moment-to-moment experience of participants.",
    "about.bring":"What I Bring", "about.bringText":"My engineering background gives me a strong foundation in systems thinking, logic, prototyping, technical constraints, and problem solving. I want to use that foundation to build engaging gameplay rather than treating design and implementation as separate worlds.",
    "approach.eyebrow":"Design Approach", "approach.title":"Simple rules. Meaningful choices. Stronger engagement.",
    "approach.lead":"My current design experience is centered on small-group multiplayer games. I focus on making the rules easy to understand while giving players reasons to communicate, take risks, compete, and keep playing until the end.",
    "approach.choice":"Meaningful Choices", "approach.choiceText":"Give players decisions that can change the outcome.",
    "approach.tension":"Competitive Tension", "approach.tensionText":"Use scoring, timing, and rewards to keep the outcome uncertain.",
    "approach.engagement":"Player Engagement", "approach.engagementText":"Design loops that encourage players to stay active and invested.",
    "work.eyebrow":"Selected Work", "work.title":"Game Design Projects", "work.lead":"Three multiplayer experiences designed and run for real participants.",
    "project.station.tag":"Exploration · Puzzle · Comeback", "project.station.desc":"A 3-hour location-based team game combining clues, exploration, station challenges, scoring, and a late-game secret station.",
    "project.beach.tag":"Risk · Reward · Competition", "project.beach.desc":"An Olympic-style multiplayer game where teams wager points across eight physical mini-games.",
    "project.calorie.tag":"Prediction · Accuracy · Power-ups", "project.calorie.desc":"A 1-hour prediction game combining correct answers, estimation accuracy, bonus scoring, and strategic information cards.",
    "case1.label":"Case Study 01", "case1.title":"Station Hunt", "case1.lead":"Designing exploration and a late-game comeback opportunity for a location-based team game.",
    "case1.goal":"Design Goal", "case1.goalText":"Create an outdoor team experience that encourages exploration, communication, puzzle solving, and continuous competition over a three-hour session.",
    "case1.mechanics":"Core Mechanics", "case1.station":"Station Discovery", "case1.comeback":"Comeback Mechanic", "case1.loop":"Core Gameplay Loop", "case1.intent":"Design Intent", "case1.next":"What I Would Explore Next",
    "case1.mechanic1":"Puzzle-based station discovery", "case1.mechanic2":"Location-based exploration", "case1.mechanic3":"Photo verification", "case1.mechanic4":"Station challenges", "case1.mechanic5":"Point-based progression", "case1.mechanic6":"Late-game Secret Station",
    "case1.loop1":"Receive Clues", "case1.loop2":"Solve Puzzle", "case1.loop3":"Find Station", "case1.loop4":"Take Photo", "case1.loop5":"Complete Challenge", "case1.loop6":"Earn Points", "case1.loop7":"Find Next Station",
    "case1.stationText1":"Each team received a list of five clues. Solving a clue revealed information needed to locate a station. At the station, the team completed a challenge to earn points.",
    "case1.stationText2":"The original game material included station clues, hints, challenges, and rules for keeping the team together.",
    "case1.comebackText":"After 60% of the play time, a Secret Station became available. It offered a high-value scoring opportunity, giving lower-scoring teams a reason to keep competing instead of mentally giving up early.",
    "case1.intentText":"The game was designed so that the leaderboard would not feel completely decided too early. Exploration created physical movement and discovery; puzzles created cognitive challenges; station tasks created varied interactions; and the Secret Station added uncertainty late in the game.",
    "case1.nextText":"For a future iteration, I would collect more structured player feedback and analyze station completion times, score gaps, and the impact of the Secret Station on the final ranking. This would help balance station difficulty and comeback potential more systematically.",
    "case2.label":"Case Study 02", "case2.title":"Beach Games: Risk & Reward", "case2.lead":"Turning a collection of physical mini-games into a strategic competition through a shared point economy.",
    "case2.goal":"Design Goal", "case2.resource":"Starting Resource", "case2.loop":"Risk / Reward Loop", "case2.games":"Eight Mini-games", "case2.choice":"Player Choice", "case2.intent":"Design Intent", "case2.next":"What I Would Explore Next",
    "case2.goalText":"Connect eight simple physical games with a system that creates strategic decisions rather than treating every mini-game as an isolated activity.",
    "case2.resourceText":"Each team starts with <strong>100 points</strong>. Before each mini-game, the team decides how many points it is willing to risk.",
    "case2.loop1":"100 Starting Points", "case2.loop2":"Choose Wager", "case2.loop3":"Play Mini-game", "case2.loop4":"Win / Lose", "case2.loop5":"Update Score", "case2.loop6":"Next Game",
    "case2.formula":"WIN = WAGER × 2 &nbsp;&nbsp;|&nbsp;&nbsp; LOSE = WAGER LOST",
    "case2.game1":"Sack Race", "case2.game2":"Capture the Flag", "case2.game3":"Team Water Transport", "case2.game4":"Water Passing by Feet", "case2.game5":"Leaky Pipe Water Transfer", "case2.game6":"Dizzy Race", "case2.game7":"Sandcastle Building", "case2.game8":"Staring Contest",
    "case2.choiceText":"The core decision is not simply “Can we win this game?” It is “How much are we willing to risk if we believe we can win?” This creates tension between protecting an existing lead and taking a larger risk for a bigger payoff.",
    "case2.intentText":"The shared point economy links all eight challenges into one larger competitive system. A team's decision in one mini-game affects the resources available for the next one.",
    "case2.nextText":"I would test different wager limits and reward multipliers to understand how much risk players are willing to take and whether the scoring system creates enough opportunities for a trailing team to recover.",
    "case3.label":"Case Study 03", "case3.title":"Calorie Challenge", "case3.lead":"Designing a simple food quiz around prediction accuracy, bonus scoring, and information-based power-ups.",
    "case3.goal":"Design Goal", "case3.interaction":"Core Interaction", "case3.scoring":"Scoring Concept", "case3.powerups":"Power-ups", "case3.intent":"Design Intent", "case3.next":"What I Would Explore Next",
    "case3.goalText":"Turn a simple “which food has fewer calories?” question into a competitive prediction game where accuracy matters.",
    "case3.interactionText":"Each round presents two food images. Teams identify which food has fewer calories and estimate the difference between the two.",
    "case3.scoringText":"The game rewards both correctness and estimation accuracy. A correct identification provides a baseline score, while the bonus favors the team whose estimate is closer to the actual calorie difference.",
    "case3.formula":"BONUS SCORE = ACTUAL CALORIE DIFFERENCE − PREDICTION ERROR",
    "case3.powerup1":"Double-score card", "case3.powerup2":"Information card revealing which food has more calories",
    "case3.intentText":"Power-ups introduce an additional strategic layer. Players must decide when information or score multiplication is more valuable instead of relying only on knowledge.",
    "case3.nextText":"I would test the difficulty of calorie comparisons and the frequency of power-ups to ensure that knowledge, estimation skill, and strategy all contribute meaningfully to the outcome.",
    "activities.eyebrow":"Activities", "activities.title":"Designing and running experiences with real players.",
    "activities.lead":"My Game Design experience started through English club and volunteer activities, where I worked with groups to create and facilitate interactive experiences.",

    "activities.volunteer3":"Adapted activity flow and rules based on participant engagement and group dynamics.",
    "contact.eyebrow":"Contact", "contact.title":"Let's build engaging experiences.", "contact.lead":"I am currently looking for opportunities to grow as a Game Designer, particularly in gameplay, systems, and player experience.",

    "about.eyebrow":"Giới thiệu", "about.title":"Từ kỹ thuật phần mềm đến thiết kế game.",
    "about.lead":"Tôi có hơn 3 năm kinh nghiệm phát triển web và mobile. Trong quá trình đó, tôi nhận ra mình đặc biệt yêu thích việc thiết kế trải nghiệm tương tác: người chơi sẽ làm gì, họ phải đưa ra lựa chọn nào và luật chơi có thể giữ họ tham gia như thế nào.",
    "about.why":"Tại sao thiết kế game?", "about.whyText":"Tôi bắt đầu khám phá thiết kế game thông qua các hoạt động của CLB tiếng Anh và nhóm tình nguyện, nơi tôi thiết kế và tổ chức các game multiplayer cho nhóm nhỏ. Những trải nghiệm này khiến tôi quan tâm đến vòng lặp gameplay, cách tính điểm, quyết định của người chơi, cạnh tranh và trải nghiệm trong từng khoảnh khắc.",
    "about.bring":"Tôi mang đến điều gì?", "about.bringText":"Nền tảng kỹ thuật giúp tôi có tư duy hệ thống, logic, khả năng prototyping, hiểu giới hạn kỹ thuật và giải quyết vấn đề. Tôi muốn dùng nền tảng đó để xây dựng gameplay hấp dẫn, thay vì xem thiết kế và triển khai là hai thế giới tách biệt.",
    "approach.eyebrow":"Tư duy thiết kế", "approach.title":"Luật đơn giản. Lựa chọn có ý nghĩa. Trải nghiệm hấp dẫn.",
    "approach.lead":"Kinh nghiệm design hiện tại của tôi tập trung vào các game multiplayer nhóm nhỏ. Tôi ưu tiên luật dễ hiểu nhưng vẫn tạo lý do để người chơi giao tiếp, mạo hiểm, cạnh tranh và tiếp tục chơi đến cuối.",
    "approach.choice":"Lựa chọn có ý nghĩa", "approach.choiceText":"Tạo ra những quyết định có khả năng thay đổi kết quả.",
    "approach.tension":"Căng thẳng cạnh tranh", "approach.tensionText":"Dùng điểm số, thời gian và phần thưởng để giữ kết quả chưa thể đoán trước.",
    "approach.engagement":"Sự tham gia", "approach.engagementText":"Thiết kế loop khiến người chơi luôn có lý do để tiếp tục tham gia.",
    "work.eyebrow":"Dự án tiêu biểu", "work.title":"Các dự án Game Design", "work.lead":"Ba trải nghiệm multiplayer được tôi thiết kế và tổ chức với người chơi thực tế.",
    "project.station.tag":"Khám phá · Puzzle · Comeback", "project.station.desc":"Game nhóm 3 giờ theo hình thức location-based, kết hợp clue, khám phá, thử thách tại trạm, tính điểm và Secret Station ở cuối game.",

    "case1.comebackText":"Sau 60% thời lượng chơi, Secret Station được mở. Đây là cơ hội ghi điểm cao, giúp các đội đang thấp điểm vẫn có lý do để tiếp tục cạnh tranh thay vì bỏ cuộc sớm về mặt tinh thần.",

    "case1.nextText":"Ở phiên bản tiếp theo, tôi muốn thu thập feedback có cấu trúc hơn và phân tích thời gian hoàn thành từng trạm, khoảng cách điểm và ảnh hưởng của Secret Station đến thứ hạng cuối. Từ đó có thể cân bằng độ khó và comeback tốt hơn.",

    "case2.choiceText":"Quyết định cốt lõi không chỉ là “Đội mình có thắng game này không?” mà là “Nếu tin mình sẽ thắng, mình sẵn sàng mạo hiểm bao nhiêu điểm?”. Điều này tạo căng thẳng giữa bảo toàn lợi thế và mạo hiểm để nhận phần thưởng lớn hơn.",

    "contact.eyebrow":"Liên hệ", "contact.title":"Cùng xây dựng những trải nghiệm hấp dẫn.", "contact.lead":"Tôi đang tìm kiếm cơ hội phát triển với vai trò nhà thiết kế game, đặc biệt trong gameplay, hệ thống và trải nghiệm người chơi.",
    "contact.email":"Gửi Email", "contact.resume":"CV",
    "footer.text":"© 2026 Nguyễn Huỳnh Khuyết Hưng · Game Designer"
  }
};

function setText(key, value) {
  const el = document.querySelector(`[data-key="${key}"]`);
  if (el) el.innerHTML = value;
}

function applyLanguage(lang) {
  document.documentElement.lang = lang === "vi" ? "vi" : "en";
  document.title = bilingual[lang]?.["page.title"] || bilingual.en["page.title"];
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (translations[lang]?.[key]) el.textContent = translations[lang][key];
  });
  document.querySelectorAll("[data-key]").forEach(el => {
    const key = el.dataset.key;
    const value = bilingual[lang]?.[key];
    if (value !== undefined) el.innerHTML = value;
  });
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
  localStorage.setItem("portfolio-lang", lang);
}

document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => applyLanguage(btn.dataset.lang));
});
applyLanguage(localStorage.getItem("portfolio-lang") || "en");
</script>
